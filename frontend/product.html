<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopHub — Product Details</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark site-navbar sticky-top shadow-sm">
  <div class="container">
    <a class="navbar-brand" href="index.html"><i class="bi bi-bag-check-fill me-2"></i>ShopHub</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain" aria-controls="navbarMain" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarMain">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2 py-2 py-lg-0" id="nav"></ul>
    </div>
  </div>
</nav>

<main>
  <div id="message" class="message"></div>
  <div id="productDetail" class="card" style="max-width:500px;"></div>

  <div id="relatedSection" style="display:none;">
    <h2 style="margin-top:2.5rem;">You might also like</h2>
    <div class="grid" id="relatedGrid"></div>
  </div>
</main>

<footer class="text-center py-4 small">
  &copy; 2026 ShopHub. Built with Laravel &amp; vanilla JS.
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script>
renderNav();

const params = new URLSearchParams(window.location.search);
const productId = params.get('id');

async function loadProduct() {
  try {
    const p = await apiRequest(`/products/${productId}`);
    document.getElementById('productDetail').innerHTML = `
      <img class="card-img" style="height:280px;" src="${p.image_url || 'https://placehold.co/600x450?text=No+Image'}" alt="${p.name}">
      <h2>${p.name}</h2>
      <p class="price">$${Number(p.price).toFixed(2)}</p>
      <p class="stock">${p.stock} in stock &middot; ${p.category ? p.category.name : ''}</p>
      <p class="stock">Sold by ${p.seller ? p.seller.name : 'ShopHub'}</p>
      <p>${p.description || ''}</p>
      <label>Quantity</label>
      <input type="number" id="qty" value="1" min="1" max="${p.stock}" style="width:100px;">
      <br><br>
      <button id="addBtn">Add to Cart</button>
    `;
    document.getElementById('addBtn').addEventListener('click', addToCart);

    if (p.category) {
      loadRelatedProducts(p.category.slug);
    }
  } catch (e) {
    showMessage('message', e.message);
  }
}

async function loadRelatedProducts(categorySlug) {
  try {
    const products = await apiRequest(`/products?category=${encodeURIComponent(categorySlug)}`);
    const related = products.filter(p => p.id != productId).slice(0, 4);
    if (related.length === 0) return;

    const grid = document.getElementById('relatedGrid');
    grid.innerHTML = related.map(p => `
      <div class="card">
        <a href="product.html?id=${p.id}"><img class="card-img" src="${p.image_url || 'https://placehold.co/400x300?text=No+Image'}" alt="${p.name}"></a>
        <h3><a href="product.html?id=${p.id}">${p.name}</a></h3>
        <p class="price">$${Number(p.price).toFixed(2)}</p>
        <p class="stock">${p.stock} in stock</p>
      </div>
    `).join('');
    document.getElementById('relatedSection').style.display = 'block';
  } catch (e) {
    // non-fatal
  }
}

async function addToCart() {
  if (!isLoggedIn()) {
    window.location.href = 'login.html';
    return;
  }
  const qty = Number(document.getElementById('qty').value);
  try {
    await apiRequest('/cart', { method: 'POST', auth: true, body: { product_id: Number(productId), quantity: qty } });
    showMessage('message', 'Added to cart.', false);
  } catch (e) {
    showMessage('message', e.message);
  }
}

loadProduct();
</script>
</body>
</html>
