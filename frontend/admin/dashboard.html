<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopHub Admin — Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark site-navbar sticky-top shadow-sm">
  <div class="container">
    <a class="navbar-brand" href="../index.html"><i class="bi bi-bag-check-fill me-2"></i>ShopHub <span class="fw-normal opacity-75">Admin</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain" aria-controls="navbarMain" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarMain">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2 py-2 py-lg-0" id="nav"></ul>
    </div>
  </div>
</nav>

<main>
  <h2>Dashboard</h2>
  <div id="message" class="message"></div>

  <div class="stat-grid" id="statGrid"></div>

  <div class="chart-grid">
    <div class="card chart-card">
      <h3>Revenue — last 14 days</h3>
      <canvas id="revenueChart" height="220"></canvas>
    </div>
    <div class="card chart-card">
      <h3>Orders by status</h3>
      <canvas id="statusChart" height="220"></canvas>
    </div>
  </div>

  <div class="card chart-card mt-4" style="max-width:100%;">
    <h3>Top 5 products by units sold</h3>
    <canvas id="topProductsChart" height="180"></canvas>
  </div>
</main>

<footer class="text-center py-4 small">
  &copy; 2026 ShopHub. Built with Laravel &amp; vanilla JS.
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="../js/api.js"></script>
<script>
renderNav();

if (!isLoggedIn() || !isAdmin()) {
  window.location.href = '../login.html';
}

// Validated categorical set (scripts/validate_palette.js) — passes CVD + normal-vision
// separation for this fixed order; status names are always shown as axis labels too,
// so identity never relies on color alone.
const STATUS_COLORS = {
  pending: '#eb6834',
  processing: '#2a78d6',
  shipped: '#4a3aa7',
  delivered: '#1baf7a',
  cancelled: '#e34948',
};

function statTile(label, value, icon) {
  return `
    <div class="stat-tile">
      <div class="stat-icon"><i class="bi ${icon}"></i></div>
      <div>
        <div class="stat-value">${value}</div>
        <div class="stat-label">${label}</div>
      </div>
    </div>
  `;
}

async function loadDashboard() {
  try {
    const stats = await apiRequest('/stats', { auth: true });

    document.getElementById('statGrid').innerHTML = [
      statTile('Total Revenue', `$${Number(stats.total_revenue).toFixed(2)}`, 'bi-currency-dollar'),
      statTile('Total Orders', stats.total_orders, 'bi-receipt'),
      statTile('Total Products', stats.total_products, 'bi-boxes'),
      statTile('Total Customers', stats.total_customers, 'bi-people'),
    ].join('');

    const revenueByDay = stats.revenue_by_day;
    new Chart(document.getElementById('revenueChart'), {
      type: 'line',
      data: {
        labels: revenueByDay.map(r => new Date(r.day).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })),
        datasets: [{
          label: 'Revenue',
          data: revenueByDay.map(r => Number(r.revenue)),
          borderColor: '#2a78d6',
          backgroundColor: 'rgba(42, 120, 214, 0.12)',
          borderWidth: 2,
          pointRadius: 3,
          pointBackgroundColor: '#2a78d6',
          fill: true,
          tension: 0.25,
        }],
      },
      options: {
        plugins: { legend: { display: false } },
        scales: {
          y: { beginAtZero: true, grid: { color: '#e1e0d9' }, ticks: { callback: v => '$' + v } },
          x: { grid: { display: false } },
        },
      },
    });

    const statuses = Object.keys(STATUS_COLORS);
    const statusCounts = statuses.map(s => stats.orders_by_status[s] || 0);
    new Chart(document.getElementById('statusChart'), {
      type: 'bar',
      data: {
        labels: statuses.map(s => s.charAt(0).toUpperCase() + s.slice(1)),
        datasets: [{
          label: 'Orders',
          data: statusCounts,
          backgroundColor: statuses.map(s => STATUS_COLORS[s]),
          borderRadius: 4,
          maxBarThickness: 40,
        }],
      },
      options: {
        indexAxis: 'y',
        plugins: { legend: { display: false } },
        scales: {
          x: { beginAtZero: true, ticks: { precision: 0 }, grid: { color: '#e1e0d9' } },
          y: { grid: { display: false } },
        },
      },
    });

    const topProducts = stats.top_products;
    new Chart(document.getElementById('topProductsChart'), {
      type: 'bar',
      data: {
        labels: topProducts.map(p => p.name),
        datasets: [{
          label: 'Units sold',
          data: topProducts.map(p => p.units_sold),
          backgroundColor: '#2a78d6',
          borderRadius: 4,
          maxBarThickness: 48,
        }],
      },
      options: {
        plugins: { legend: { display: false } },
        scales: {
          y: { beginAtZero: true, ticks: { precision: 0 }, grid: { color: '#e1e0d9' } },
          x: { grid: { display: false } },
        },
      },
    });
  } catch (e) {
    showMessage('message', e.message);
  }
}

loadDashboard();
</script>
</body>
</html>
