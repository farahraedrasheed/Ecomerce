<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Manage Products — Admin</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header>
  <h1>E-Commerce Platform — Admin</h1>
  <nav id="nav"></nav>
</header>

<main>
  <h2>Manage Products</h2>
  <div id="message" class="message"></div>

  <form id="productForm">
    <h3 id="formTitle">Add New Product</h3>
    <input type="hidden" id="productId">
    <label>Category ID</label>
    <input type="number" id="categoryId" required>
    <label>Name</label>
    <input type="text" id="name" required>
    <label>Description</label>
    <textarea id="description" rows="2"></textarea>
    <label>Price</label>
    <input type="number" id="price" step="0.01" min="0" required>
    <label>Stock</label>
    <input type="number" id="stock" min="0" required>
    <br><br>
    <button type="submit" id="submitBtn">Create Product</button>
    <button type="button" id="cancelEditBtn" class="secondary" style="display:none;">Cancel</button>
  </form>

  <h3 style="margin-top:2rem;">All Products</h3>
  <table>
    <thead><tr><th>ID</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Active</th><th></th></tr></thead>
    <tbody id="productsBody"></tbody>
  </table>
</main>

<script src="../js/api.js"></script>
<script>
renderNav();

if (!isLoggedIn() || !isAdmin()) {
  window.location.href = '../login.html';
}

async function loadProducts() {
  try {
    const products = await apiRequest('/products', { auth: true });
    document.getElementById('productsBody').innerHTML = products.map(p => `
      <tr>
        <td>${p.id}</td>
        <td>${p.name}</td>
        <td>${p.category ? p.category.name : p.category_id}</td>
        <td>$${Number(p.price).toFixed(2)}</td>
        <td>${p.stock}</td>
        <td>${p.is_active ? 'Yes' : 'No'}</td>
        <td>
          <button class="editBtn" data-id="${p.id}">Edit</button>
          <button class="danger deactivateBtn" data-id="${p.id}" data-active="${p.is_active}">
            ${p.is_active ? 'Deactivate' : 'Activate'}
          </button>
          <button class="danger deleteBtn" data-id="${p.id}">Delete</button>
        </td>
      </tr>
    `).join('');

    document.querySelectorAll('.editBtn').forEach(btn => {
      const product = products.find(p => p.id == btn.dataset.id);
      btn.addEventListener('click', () => editProduct(product));
    });
    document.querySelectorAll('.deactivateBtn').forEach(btn => {
      btn.addEventListener('click', () => toggleActive(btn.dataset.id, btn.dataset.active === 'true'));
    });
    document.querySelectorAll('.deleteBtn').forEach(btn => {
      btn.addEventListener('click', () => deleteProduct(btn.dataset.id));
    });
  } catch (e) {
    showMessage('message', e.message);
  }
}

function editProduct(product) {
  document.getElementById('formTitle').textContent = `Editing: ${product.name}`;
  document.getElementById('productId').value = product.id;
  document.getElementById('categoryId').value = product.category_id;
  document.getElementById('name').value = product.name;
  document.getElementById('description').value = product.description || '';
  document.getElementById('price').value = product.price;
  document.getElementById('stock').value = product.stock;
  document.getElementById('submitBtn').textContent = 'Save Changes';
  document.getElementById('cancelEditBtn').style.display = 'inline-block';
}

function resetForm() {
  document.getElementById('productForm').reset();
  document.getElementById('productId').value = '';
  document.getElementById('formTitle').textContent = 'Add New Product';
  document.getElementById('submitBtn').textContent = 'Create Product';
  document.getElementById('cancelEditBtn').style.display = 'none';
}

document.getElementById('cancelEditBtn').addEventListener('click', resetForm);

document.getElementById('productForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const id = document.getElementById('productId').value;
  const payload = {
    category_id: Number(document.getElementById('categoryId').value),
    name: document.getElementById('name').value,
    description: document.getElementById('description').value,
    price: Number(document.getElementById('price').value),
    stock: Number(document.getElementById('stock').value),
  };

  try {
    if (id) {
      await apiRequest(`/products/${id}`, { method: 'PUT', auth: true, body: payload });
      showMessage('message', 'Product updated.', false);
    } else {
      await apiRequest('/products', { method: 'POST', auth: true, body: payload });
      showMessage('message', 'Product created.', false);
    }
    resetForm();
    loadProducts();
  } catch (e) {
    showMessage('message', e.message);
  }
});

async function toggleActive(id, currentlyActive) {
  try {
    await apiRequest(`/products/${id}`, { method: 'PUT', auth: true, body: { is_active: !currentlyActive } });
    loadProducts();
  } catch (e) {
    showMessage('message', e.message);
  }
}

async function deleteProduct(id) {
  if (!confirm('Delete this product permanently?')) return;
  try {
    await apiRequest(`/products/${id}`, { method: 'DELETE', auth: true });
    loadProducts();
  } catch (e) {
    showMessage('message', e.message);
  }
}

loadProducts();
</script>
</body>
</html>
