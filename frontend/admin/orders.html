<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopHub Admin — Orders</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark site-navbar sticky-top shadow-sm">
  <div class="container">
    <a class="navbar-brand" href="../index.html"><i class="bi bi-bag-check-fill me-2"></i>ShopHub <span class="fw-normal opacity-75">Admin</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain" aria-controls="navbarMain" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarMain">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2 py-2 py-lg-0" id="nav"></ul>
    </div>
  </div>
</nav>

<main>
  <h2>All Orders</h2>
  <div id="message" class="message"></div>
  <div id="ordersList"></div>
</main>

<footer class="text-center py-4 small">
  &copy; 2026 ShopHub. Built with Laravel &amp; vanilla JS.
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script>
renderNav();

if (!isLoggedIn() || !isAdmin()) {
  window.location.href = '../login.html';
}

const STATUSES = ['pending', 'processing', 'shipped', 'delivered', 'cancelled'];

async function loadOrders() {
  try {
    const orders = await apiRequest('/orders', { auth: true });
    const list = document.getElementById('ordersList');

    if (orders.length === 0) {
      list.innerHTML = '<p class="empty-state">No orders yet.</p>';
      return;
    }

    list.innerHTML = orders.map(order => `
      <div class="card" style="margin-bottom:1rem;">
        <h3>Order #${order.id} — ${order.user ? order.user.name : 'User #' + order.user_id}
          <span class="badge ${order.status}">${order.status}</span>
        </h3>
        <p>Placed: ${new Date(order.created_at).toLocaleString()}</p>
        <p>Shipping to: ${order.shipping_address}</p>
        <p>Payment: <i class="bi bi-credit-card me-1"></i>${order.payment_method === 'card' ? 'Card' : order.payment_method} ending in ${order.card_last_four || '----'} — <span class="badge ${order.payment_status}">${order.payment_status}</span></p>
        <table>
          <thead><tr><th>Product</th><th>Qty</th><th>Price</th><th>Subtotal</th></tr></thead>
          <tbody>
            ${order.items.map(item => `
              <tr>
                <td>
                  <div style="display:flex; align-items:center; gap:0.6rem;">
                    <img src="${item.product && item.product.image_url ? item.product.image_url : 'https://placehold.co/60x60?text=No+Image'}" alt="" style="width:40px;height:40px;object-fit:cover;border-radius:6px;">
                    <span>${item.product ? item.product.name : 'Product #' + item.product_id}</span>
                  </div>
                </td>
                <td>${item.quantity}</td>
                <td>$${Number(item.price).toFixed(2)}</td>
                <td>$${(item.quantity * item.price).toFixed(2)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
        <p><strong>Total: $${Number(order.total_amount).toFixed(2)}</strong></p>
        <label>Update Status</label>
        <select data-id="${order.id}" class="statusSelect" style="max-width:200px;">
          ${STATUSES.map(s => `<option value="${s}" ${s === order.status ? 'selected' : ''}>${s}</option>`).join('')}
        </select>
      </div>
    `).join('');

    document.querySelectorAll('.statusSelect').forEach(select => {
      select.addEventListener('change', () => updateStatus(select.dataset.id, select.value));
    });
  } catch (e) {
    showMessage('message', e.message);
  }
}

async function updateStatus(orderId, status) {
  try {
    await apiRequest(`/orders/${orderId}/status`, { method: 'PUT', auth: true, body: { status } });
    showMessage('message', `Order #${orderId} updated to "${status}".`, false);
  } catch (e) {
    showMessage('message', e.message);
  }
}

loadOrders();
</script>
</body>
</html>
