<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopHub Admin — Categories</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark site-navbar sticky-top shadow-sm">
  <div class="container">
    <a class="navbar-brand" href="../index.html"><i class="bi bi-bag-check-fill me-2"></i>ShopHub <span class="fw-normal opacity-75">Admin</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain" aria-controls="navbarMain" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarMain">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2 py-2 py-lg-0" id="nav"></ul>
    </div>
  </div>
</nav>

<main>
  <h2>Manage Categories</h2>
  <div id="message" class="message"></div>

  <form id="categoryForm">
    <h3 id="formTitle">Add New Category</h3>
    <input type="hidden" id="categoryId">
    <label>Name</label>
    <input type="text" id="categoryName" required>
    <br><br>
    <button type="submit" id="submitBtn">Create Category</button>
    <button type="button" id="cancelEditBtn" class="secondary" style="display:none;">Cancel</button>
  </form>

  <h3 style="margin-top:2rem;">All Categories</h3>
  <table>
    <thead><tr><th>ID</th><th>Name</th><th>Slug</th><th>Products</th><th></th></tr></thead>
    <tbody id="categoriesBody"></tbody>
  </table>
</main>

<footer class="text-center py-4 small">
  &copy; 2026 ShopHub. Built with Laravel &amp; vanilla JS.
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script>
renderNav();

if (!isLoggedIn() || !isAdmin()) {
  window.location.href = '../login.html';
}

async function loadCategories() {
  try {
    const categories = await apiRequest('/categories', { auth: true });
    document.getElementById('categoriesBody').innerHTML = categories.map(c => `
      <tr>
        <td>${c.id}</td>
        <td>${c.name}</td>
        <td>${c.slug}</td>
        <td>${c.products_count}</td>
        <td>
          <button class="editBtn" data-id="${c.id}">Edit</button>
          <button class="danger deleteBtn" data-id="${c.id}">Delete</button>
        </td>
      </tr>
    `).join('');

    document.querySelectorAll('.editBtn').forEach(btn => {
      const category = categories.find(c => c.id == btn.dataset.id);
      btn.addEventListener('click', () => editCategory(category));
    });
    document.querySelectorAll('.deleteBtn').forEach(btn => {
      btn.addEventListener('click', () => deleteCategory(btn.dataset.id));
    });
  } catch (e) {
    showMessage('message', e.message);
  }
}

function editCategory(category) {
  document.getElementById('formTitle').textContent = `Editing: ${category.name}`;
  document.getElementById('categoryId').value = category.id;
  document.getElementById('categoryName').value = category.name;
  document.getElementById('submitBtn').textContent = 'Save Changes';
  document.getElementById('cancelEditBtn').style.display = 'inline-block';
}

function resetForm() {
  document.getElementById('categoryForm').reset();
  document.getElementById('categoryId').value = '';
  document.getElementById('formTitle').textContent = 'Add New Category';
  document.getElementById('submitBtn').textContent = 'Create Category';
  document.getElementById('cancelEditBtn').style.display = 'none';
}

document.getElementById('cancelEditBtn').addEventListener('click', resetForm);

document.getElementById('categoryForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const id = document.getElementById('categoryId').value;
  const payload = { name: document.getElementById('categoryName').value };

  try {
    if (id) {
      await apiRequest(`/categories/${id}`, { method: 'PUT', auth: true, body: payload });
      showMessage('message', 'Category updated.', false);
    } else {
      await apiRequest('/categories', { method: 'POST', auth: true, body: payload });
      showMessage('message', 'Category created.', false);
    }
    resetForm();
    loadCategories();
  } catch (e) {
    showMessage('message', e.message);
  }
});

async function deleteCategory(id) {
  if (!confirm('Delete this category permanently?')) return;
  try {
    await apiRequest(`/categories/${id}`, { method: 'DELETE', auth: true });
    loadCategories();
  } catch (e) {
    showMessage('message', e.message);
  }
}

loadCategories();
</script>
</body>
</html>
