<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <h1>E-Commerce Platform</h1>
  <nav id="nav"></nav>
</header>

<main>
  <h2>Login</h2>
  <form id="loginForm">
    <div id="message" class="message"></div>
    <label>Email</label>
    <input type="email" id="email" required>
    <label>Password</label>
    <input type="password" id="password" required>
    <br><br>
    <button type="submit">Login</button>
  </form>
  <p style="margin-top:1rem; color:#6b7280; font-size:0.85rem;">
    Demo accounts — Admin: admin@example.com / password &middot; Customer: customer@example.com / password
  </p>
</main>

<script src="js/api.js"></script>
<script>
renderNav();

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  try {
    const data = await apiRequest('/login', { method: 'POST', body: { email, password } });
    setSession(data.user, data.token);
    window.location.href = 'index.html';
  } catch (e) {
    showMessage('message', e.message);
  }
});
</script>
</body>
</html>
