<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopHub — Sell a Product</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark site-navbar sticky-top shadow-sm">
  <div class="container">
    <a class="navbar-brand" href="index.html"><i class="bi bi-bag-check-fill me-2"></i>ShopHub</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain" aria-controls="navbarMain" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarMain">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2 py-2 py-lg-0" id="nav"></ul>
    </div>
  </div>
</nav>

<main>
  <h2>Sell a Product</h2>
  <p class="text-muted">List an item for sale. It goes live on the storefront immediately.</p>
  <div id="message" class="message"></div>

  <form id="productForm">
    <h3 id="formTitle">New Listing</h3>
    <input type="hidden" id="productId">
    <label>Category</label>
    <select id="categoryId" required>
      <option value="">Select a category&hellip;</option>
    </select>
    <label>Name</label>
    <input type="text" id="name" required>
    <label>Description</label>
    <textarea id="description" rows="2"></textarea>
    <label>Image URL</label>
    <input type="url" id="imageUrl" placeholder="https://example.com/photo.jpg">
    <label>Price</label>
    <input type="number" id="price" step="0.01" min="0" required>
    <label>Stock</label>
    <input type="number" id="stock" min="0" required>
    <br><br>
    <button type="submit" id="submitBtn">Publish Listing</button>
    <button type="button" id="cancelEditBtn" class="secondary" style="display:none;">Cancel</button>
  </form>

  <h3 style="margin-top:2rem;">My Listings</h3>
  <table>
    <thead><tr><th>Image</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Active</th><th></th></tr></thead>
    <tbody id="productsBody"></tbody>
  </table>
</main>

<footer class="text-center py-4 small">
  &copy; 2026 ShopHub. Built with Laravel &amp; vanilla JS.
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script>
renderNav();

if (!isLoggedIn()) {
  window.location.href = 'login.html';
}

async function loadCategoryOptions() {
  try {
    const categories = await apiRequest('/categories', { auth: true });
    const select = document.getElementById('categoryId');
    categories.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.id;
      opt.textContent = c.name;
      select.appendChild(opt);
    });
  } catch (e) {
    showMessage('message', e.message);
  }
}

async function loadProducts() {
  try {
    const products = await apiRequest('/my-products', { auth: true });
    const body = document.getElementById('productsBody');

    if (products.length === 0) {
      body.innerHTML = '<tr><td colspan="7" class="empty-state">You haven\'t listed any products yet.</td></tr>';
      return;
    }

    body.innerHTML = products.map(p => `
      <tr>
        <td><img src="${p.image_url || 'https://placehold.co/80x60?text=No+Image'}" alt="" style="width:56px;height:42px;object-fit:cover;border-radius:6px;"></td>
        <td>${p.name}</td>
        <td>${p.category ? p.category.name : p.category_id}</td>
        <td>$${Number(p.price).toFixed(2)}</td>
        <td>${p.stock}</td>
        <td>${p.is_active ? 'Yes' : 'No'}</td>
        <td>
          <button class="editBtn" data-id="${p.id}">Edit</button>
          <button class="danger deactivateBtn" data-id="${p.id}" data-active="${p.is_active}">
            ${p.is_active ? 'Deactivate' : 'Activate'}
          </button>
          <button class="danger deleteBtn" data-id="${p.id}">Delete</button>
        </td>
      </tr>
    `).join('');

    document.querySelectorAll('.editBtn').forEach(btn => {
      const product = products.find(p => p.id == btn.dataset.id);
      btn.addEventListener('click', () => editProduct(product));
    });
    document.querySelectorAll('.deactivateBtn').forEach(btn => {
      btn.addEventListener('click', () => toggleActive(btn.dataset.id, btn.dataset.active === 'true'));
    });
    document.querySelectorAll('.deleteBtn').forEach(btn => {
      btn.addEventListener('click', () => deleteProduct(btn.dataset.id));
    });
  } catch (e) {
    showMessage('message', e.message);
  }
}

function editProduct(product) {
  document.getElementById('formTitle').textContent = `Editing: ${product.name}`;
  document.getElementById('productId').value = product.id;
  document.getElementById('categoryId').value = product.category_id;
  document.getElementById('name').value = product.name;
  document.getElementById('description').value = product.description || '';
  document.getElementById('imageUrl').value = product.image_url || '';
  document.getElementById('price').value = product.price;
  document.getElementById('stock').value = product.stock;
  document.getElementById('submitBtn').textContent = 'Save Changes';
  document.getElementById('cancelEditBtn').style.display = 'inline-block';
}

function resetForm() {
  document.getElementById('productForm').reset();
  document.getElementById('productId').value = '';
  document.getElementById('formTitle').textContent = 'New Listing';
  document.getElementById('submitBtn').textContent = 'Publish Listing';
  document.getElementById('cancelEditBtn').style.display = 'none';
}

document.getElementById('cancelEditBtn').addEventListener('click', resetForm);

document.getElementById('productForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const id = document.getElementById('productId').value;
  const payload = {
    category_id: Number(document.getElementById('categoryId').value),
    name: document.getElementById('name').value,
    description: document.getElementById('description').value,
    image_url: document.getElementById('imageUrl').value || null,
    price: Number(document.getElementById('price').value),
    stock: Number(document.getElementById('stock').value),
  };

  try {
    if (id) {
      await apiRequest(`/products/${id}`, { method: 'PUT', auth: true, body: payload });
      showMessage('message', 'Listing updated.', false);
    } else {
      await apiRequest('/products', { method: 'POST', auth: true, body: payload });
      showMessage('message', 'Listing published.', false);
    }
    resetForm();
    loadProducts();
  } catch (e) {
    showMessage('message', e.message);
  }
});

async function toggleActive(id, currentlyActive) {
  try {
    await apiRequest(`/products/${id}`, { method: 'PUT', auth: true, body: { is_active: !currentlyActive } });
    loadProducts();
  } catch (e) {
    showMessage('message', e.message);
  }
}

async function deleteProduct(id) {
  if (!confirm('Delete this listing permanently?')) return;
  try {
    await apiRequest(`/products/${id}`, { method: 'DELETE', auth: true });
    loadProducts();
  } catch (e) {
    showMessage('message', e.message);
  }
}

loadCategoryOptions();
loadProducts();
</script>
</body>
</html>
