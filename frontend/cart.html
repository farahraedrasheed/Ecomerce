<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopHub — Cart</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark site-navbar sticky-top shadow-sm">
  <div class="container">
    <a class="navbar-brand" href="index.html"><i class="bi bi-bag-check-fill me-2"></i>ShopHub</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain" aria-controls="navbarMain" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarMain">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2 py-2 py-lg-0" id="nav"></ul>
    </div>
  </div>
</nav>

<main>
  <h2>My Cart</h2>
  <div id="message" class="message"></div>
  <table id="cartTable" style="display:none;">
    <thead>
      <tr><th>Product</th><th>Price</th><th>Quantity</th><th>Subtotal</th><th></th></tr>
    </thead>
    <tbody id="cartBody"></tbody>
  </table>
  <p id="emptyState" class="empty-state" style="display:none;">Your cart is empty.</p>
  <h3 id="cartTotal"></h3>
  <a href="checkout.html" class="btn" id="checkoutBtn" style="display:none; text-decoration:none;">Proceed to Checkout</a>
</main>

<footer class="text-center py-4 small">
  &copy; 2026 ShopHub. Built with Laravel &amp; vanilla JS.
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script>
renderNav();

if (!isLoggedIn()) {
  window.location.href = 'login.html';
}

async function loadCart() {
  try {
    const { items, total } = await apiRequest('/cart', { auth: true });
    const body = document.getElementById('cartBody');
    body.innerHTML = '';

    if (items.length === 0) {
      document.getElementById('emptyState').style.display = 'block';
      document.getElementById('cartTable').style.display = 'none';
      document.getElementById('checkoutBtn').style.display = 'none';
      document.getElementById('cartTotal').textContent = '';
      return;
    }

    document.getElementById('emptyState').style.display = 'none';
    document.getElementById('cartTable').style.display = 'table';
    document.getElementById('checkoutBtn').style.display = 'inline-block';

    items.forEach(item => {
      const row = document.createElement('tr');
      row.innerHTML = `
        <td>
          <div style="display:flex; align-items:center; gap:0.6rem;">
            <img src="${item.product.image_url || 'https://placehold.co/60x60?text=No+Image'}" alt="" style="width:48px;height:48px;object-fit:cover;border-radius:6px;">
            <span>${item.product.name}</span>
          </div>
        </td>
        <td>$${Number(item.product.price).toFixed(2)}</td>
        <td>
          <input type="number" min="1" max="${item.product.stock}" value="${item.quantity}"
                 data-id="${item.id}" class="qtyInput" style="width:70px;">
        </td>
        <td>$${(item.quantity * item.product.price).toFixed(2)}</td>
        <td><button class="danger removeBtn" data-id="${item.id}">Remove</button></td>
      `;
      body.appendChild(row);
    });

    document.getElementById('cartTotal').textContent = `Total: $${Number(total).toFixed(2)}`;

    document.querySelectorAll('.qtyInput').forEach(input => {
      input.addEventListener('change', () => updateQuantity(input.dataset.id, input.value));
    });
    document.querySelectorAll('.removeBtn').forEach(btn => {
      btn.addEventListener('click', () => removeItem(btn.dataset.id));
    });
  } catch (e) {
    showMessage('message', e.message);
  }
}

async function updateQuantity(id, quantity) {
  try {
    await apiRequest(`/cart/${id}`, { method: 'PUT', auth: true, body: { quantity: Number(quantity) } });
    loadCart();
  } catch (e) {
    showMessage('message', e.message);
  }
}

async function removeItem(id) {
  try {
    await apiRequest(`/cart/${id}`, { method: 'DELETE', auth: true });
    loadCart();
  } catch (e) {
    showMessage('message', e.message);
  }
}

loadCart();
</script>
</body>
</html>
