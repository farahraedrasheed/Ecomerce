<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopHub — Storefront</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark site-navbar sticky-top shadow-sm">
  <div class="container">
    <a class="navbar-brand" href="index.html"><i class="bi bi-bag-check-fill me-2"></i>ShopHub</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain" aria-controls="navbarMain" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarMain">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2 py-2 py-lg-0" id="nav"></ul>
    </div>
  </div>
</nav>

<main>
  <section class="hero rounded-4 p-5 mb-4 text-white">
    <h1 class="display-6 fw-bold mb-2">Discover products you'll love</h1>
    <p class="lead mb-0 opacity-75">Quality goods, fast shipping, happy customers.</p>
  </section>

  <h2>Products</h2>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Search products...">
    <select id="categoryFilter">
      <option value="">All categories</option>
    </select>
    <button id="searchBtn">Search</button>
  </div>

  <div id="message" class="message"></div>
  <div class="grid" id="productGrid"></div>
</main>

<footer class="text-center py-4 small">
  &copy; 2026 ShopHub. Built with Laravel &amp; vanilla JS.
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script>
renderNav();

async function loadCategories() {
  try {
    const products = await apiRequest('/products');
    const select = document.getElementById('categoryFilter');
    const seen = new Set();
    products.forEach(p => {
      if (p.category && !seen.has(p.category.slug)) {
        seen.add(p.category.slug);
        const opt = document.createElement('option');
        opt.value = p.category.slug;
        opt.textContent = p.category.name;
        select.appendChild(opt);
      }
    });
  } catch (e) {
    // non-fatal
  }
}

async function loadProducts() {
  const grid = document.getElementById('productGrid');
  grid.innerHTML = '';
  const search = document.getElementById('searchInput').value.trim();
  const category = document.getElementById('categoryFilter').value;

  const params = new URLSearchParams();
  if (search) params.set('search', search);
  if (category) params.set('category', category);
  const query = params.toString() ? `?${params.toString()}` : '';

  try {
    const products = await apiRequest(`/products${query}`);
    if (products.length === 0) {
      grid.innerHTML = '<p class="empty-state">No products found.</p>';
      return;
    }
    products.forEach(p => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <a href="product.html?id=${p.id}"><img class="card-img" src="${p.image_url || 'https://placehold.co/400x300?text=No+Image'}" alt="${p.name}"></a>
        <h3><a href="product.html?id=${p.id}">${p.name}</a></h3>
        <p class="price">$${Number(p.price).toFixed(2)}</p>
        <p class="stock">${p.stock} in stock &middot; ${p.category ? p.category.name : ''}</p>
        <button data-id="${p.id}" class="addBtn">Add to Cart</button>
      `;
      grid.appendChild(card);
    });

    document.querySelectorAll('.addBtn').forEach(btn => {
      btn.addEventListener('click', () => addToCart(btn.dataset.id));
    });
  } catch (e) {
    showMessage('message', e.message);
  }
}

async function addToCart(productId) {
  if (!isLoggedIn()) {
    window.location.href = 'login.html';
    return;
  }
  try {
    await apiRequest('/cart', { method: 'POST', auth: true, body: { product_id: Number(productId), quantity: 1 } });
    showMessage('message', 'Added to cart.', false);
  } catch (e) {
    showMessage('message', e.message);
  }
}

document.getElementById('searchBtn').addEventListener('click', loadProducts);
document.getElementById('searchInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') loadProducts();
});
document.getElementById('categoryFilter').addEventListener('change', loadProducts);

loadCategories();
loadProducts();
</script>
</body>
</html>
